<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculator</title>

    <link rel="stylesheet" href="js_folder/mini_cal.css">

</head>

<body>
    <header>MINI CALCULATOR</header>


    <main>

        <div>

            <input id="num1" type="number" placeholder="Enter your first number">





            <select id="operations">

                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>

            </select>

            <input id="num2" type="number" placeholder="Enter your second number">

            <button onclick="minical()">Calculate</button>


        </div>

        <div>

            <h3>Result: <span id="result">0</span></h3>


        </div>

        <div>

            <button onclick="resetbtn()">
                <h2>Reset</h2>
            </button>

        </div>





    </main>














    <footer>


    </footer>






</body>

<script src="js_folder/mini_cal.js"></script>


</html>
